# Repositories monitored by the Ubuntu MP Review Dashboard.
#
# Every value under `defaults` is a tunable threshold; the generated
# dashboard.json embeds them so the UI and the fetcher can never disagree.

defaults:
  # An MP is STALE when it has had no activity (comment, review vote, or
  # status change) for this many days.
  stale_after_days: 30

  # A "Needs review" MP with no comment for this many days is flagged as
  # needing attention.
  silent_after_days: 7

  # How often the GitHub Action is scheduled to fetch fresh data. The UI uses
  # it to warn when the data file is out of date (older than twice this), and
  # re-reads the published file at least hourly. Changing this value also
  # means updating the cron expression in .github/workflows/refresh.yml.
  refresh_interval_minutes: 1440

  # Launchpad's getRelatedBugTasks operation is slow (~seconds per MP).
  # Set to false if refresh runs start timing out; MPs still render, they
  # just lose their linked-bug pills and the "has linked bugs" signal.
  fetch_linked_bugs: true

  # Concurrent enrichment requests per repository.
  max_workers: 8

  # Repositories fetched at the same time. Each also runs up to max_workers
  # enrichment requests, so this multiplies the load on Launchpad.
  repo_workers: 4

teams:
  # The dashboard's top-level tabs, in this order. A repository joins a team
  # with `team: <id>`; nothing about teams is hard-coded in the UI.
  #
  # A team may also `discover` repositories at fetch time instead of listing
  # them by hand. `bug_subscriber` tracks every Ubuntu source package that
  # Launchpad team is bug-subscribed to, through the package's git-ubuntu
  # repository (lp:ubuntu/+source/<package>). Discovered repositories get the
  # id "<team id>-<package>", e.g. foundations-apport.
  #
  # `people` adds a People view to the team: every member of that Launchpad
  # team, with every open merge proposal they have, tracked here or not.
  # `exclude` lists members (Launchpad names) to leave out of that view.

  - id: archive-admin
    name: Archive Admin

  - id: release-team
    name: Release Team

  - id: foundations
    name: Foundations
    description: Ubuntu source packages ~foundations-bugs is subscribed to
    discover:
      provider: launchpad-git
      bug_subscriber: "~foundations-bugs"
    # The People view: every open MP these members proposed, anywhere.
    people:
      provider: launchpad-git
      members_of: "~canonical-foundations"

  - id: server
    name: Server
    description: Ubuntu source packages ~ubuntu-server is subscribed to
    discover:
      provider: launchpad-git
      bug_subscriber: "~ubuntu-server"

  - id: autopkgtest-infra
    name: Autopkgtest Infra

repositories:
  # Launchpad git repositories.
  #
  #   team       - id of the team (above) this repository is listed under
  #   provider   - key into the provider registry (scripts/providers/__init__.py)
  #   namespace  - Launchpad owner, including the leading "~"
  #   project    - Launchpad project name
  #   repository - git repository name under that project
  #
  # These combine into the API path {namespace}/{project}/+git/{repository}.
  # For a repository attached to a distribution source package, use
  # `source_package: <name>` (and optionally `distribution`, default ubuntu)
  # instead of `project`:
  # {namespace}/{distribution}/+source/{source_package}/+git/{repository}.

  - id: ubuntu-cdimage
    name: ubuntu-cdimage
    team: release-team
    provider: launchpad-git
    namespace: "~ubuntu-cdimage"
    project: ubuntu-cdimage
    repository: ubuntu-cdimage

  - id: livecd-rootfs
    name: livecd-rootfs
    team: release-team
    provider: launchpad-git
    namespace: "~ubuntu-core-dev"
    project: livecd-rootfs
    repository: livecd-rootfs

  - id: ubuntu-archive-tools
    name: ubuntu-archive-tools
    team: archive-admin
    provider: launchpad-git
    namespace: "~ubuntu-archive"
    project: ubuntu-archive-tools
    repository: ubuntu-archive-tools

  - id: ubuntu-archive-scripts
    name: ubuntu-archive-scripts
    team: archive-admin
    provider: launchpad-git
    namespace: "~ubuntu-archive"
    project: ubuntu-archive-scripts
    repository: ubuntu-archive-scripts

  - id: hints-ubuntu
    name: hints-ubuntu
    team: release-team
    provider: launchpad-git
    namespace: "~ubuntu-release"
    project: britney
    repository: hints-ubuntu

  - id: autopkgtest
    name: autopkgtest
    team: autopkgtest-infra
    provider: launchpad-git
    namespace: "~ubuntu-release"
    project: autopkgtest
    repository: autopkgtest

  - id: autopkgtest-package-configs
    name: autopkgtest-package-configs
    team: autopkgtest-infra
    provider: launchpad-git
    namespace: "~ubuntu-release"
    project: autopkgtest-cloud
    repository: autopkgtest-package-configs

  - id: templates
    name: ubuntu-release-tools/templates
    team: release-team
    provider: launchpad-git
    namespace: "~ubuntu-release"
    project: ubuntu-release-tools
    repository: templates

  - id: ubuntu-release-tools
    name: ubuntu-release-tools
    team: release-team
    provider: launchpad-git
    namespace: "~ubuntu-release"
    project: ubuntu-release-tools
    repository: ubuntu-release-tools

  - id: ubuntu-images
    name: ubuntu-images
    team: release-team
    provider: launchpad-git
    namespace: "~ubuntu-release"
    project: ubuntu-images
    repository: ubuntu-images

  - id: britney2
    name: britney2-ubuntu
    team: autopkgtest-infra
    provider: launchpad-git
    namespace: "~ubuntu-release"
    project: britney
    repository: britney2-ubuntu

  - id: britney1
    name: britney1-ubuntu
    team: autopkgtest-infra
    provider: launchpad-git
    namespace: "~ubuntu-release"
    project: britney
    repository: britney1-ubuntu

  # Phase 1 ships a GitHub provider stub so the shape is proven but unused.
  # Uncomment once scripts/providers/github.py is implemented.
  #
  # - id: review-gator
  #   name: review-gator
  #   provider: github
  #   namespace: canonical
  #   repository: review-gator
