<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Scripts come only from this site (plus the hashed redirect below), and the
     page may talk only to this site and the LLM providers in
     assets/reviewers/. An API key kept in this browser therefore cannot be
     sent anywhere else, even by injected script. A new provider's API host
     goes in connect-src. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-aDRWpG3NL6OdjC5DDMZqKmO1fjmLyz4DyBGgfAxnuAE='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.anthropic.com https://openrouter.ai; object-src 'none'; base-uri 'none'; form-action 'none'">
<script>
  if (!location.pathname.endsWith("/")) {
    location.replace(location.pathname + "/" + location.search + location.hash);
  }
</script>
<title>Ubuntu MP Review Dashboard</title>
<meta name="description" content="Open merge proposals across monitored Ubuntu repositories.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23E95420'/><circle cx='16' cy='6' r='3.4' fill='white'/><circle cx='7.4' cy='21' r='3.4' fill='white'/><circle cx='24.6' cy='21' r='3.4' fill='white'/><circle cx='16' cy='16' r='4.2' fill='none' stroke='white' stroke-width='2.4'/></svg>">
</head>
<body>

<header class="masthead">
  <div class="masthead__inner">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="#E95420"/>
        <circle cx="16" cy="6" r="3.4" fill="#fff"/>
        <circle cx="7.4" cy="21" r="3.4" fill="#fff"/>
        <circle cx="24.6" cy="21" r="3.4" fill="#fff"/>
        <circle cx="16" cy="16" r="4.2" fill="none" stroke="#fff" stroke-width="2.4"/>
      </svg>
      <div class="brand__text">
        <h1>Merge Proposal Review</h1>
        <p>Open reviews across monitored Ubuntu repositories</p>
      </div>
    </div>

    <div class="global-search" role="search">
      <label class="visually-hidden" for="global-search">Search repositories, teams and people</label>
      <svg class="global-search__icon" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="6.8" cy="6.8" r="4.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M10.4 10.4 14.2 14.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <input id="global-search" class="global-search__input" type="search"
             placeholder="Search repositories, teams and people" autocomplete="off" spellcheck="false" disabled
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results">
      <kbd class="global-search__kbd" aria-hidden="true">/</kbd>
      <ul id="search-results" class="search-results" role="listbox"
          aria-label="Matching repositories, teams and people" hidden></ul>
      <span id="search-status" class="visually-hidden" aria-live="polite"></span>
    </div>

    <div class="masthead__actions">
      <div class="refresh-meta">
        <span class="refresh-meta__label">Last refresh</span>
        <span class="refresh-meta__value" id="last-refresh">&hellip;</span>
      </div>
      <button type="button" class="btn" id="refresh-btn">
        <span class="btn__icon" aria-hidden="true">&#8635;</span> Refresh
      </button>
      <button type="button" class="btn btn--icon" id="theme-btn" aria-label="Toggle colour theme" title="Toggle colour theme">
        <span aria-hidden="true">&#9681;</span>
      </button>
    </div>
  </div>
</header>

<div id="banners" class="banners" role="status" aria-live="polite"></div>

<nav class="tabs" id="tabs" aria-label="Teams"></nav>

<main id="panels" class="panels">
  <p class="loading" id="loading">Loading merge proposals&hellip;</p>
</main>

<footer class="site-footer">
  <p>
    Data cached by GitHub Actions from the
    <a href="https://api.launchpad.net/devel/" rel="noopener">Launchpad API</a>.
    An MP counts as open unless it is merged, rejected or superseded.
  </p>
  <p class="site-footer__meta" id="footer-meta"></p>
</footer>

<script type="module" src="assets/app.js"></script>
</body>
</html>
